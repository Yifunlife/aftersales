name: Cloudflare production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node check.mjs
      - run: npm run build:cloudflare
      - name: Apply schema and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Add repository secret CLOUDFLARE_API_TOKEN to enable production deployments.'
            exit 1
          fi
          npx wrangler d1 migrations apply DB --remote --config wrangler.cloudflare.json
          npx wrangler deploy --config dist/server/wrangler.json
