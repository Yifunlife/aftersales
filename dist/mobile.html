<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亦玩售后 · 手机预览</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#29384c;font:14px/1.45 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 24px;border-bottom:1px solid #e5eaf0;flex-wrap:wrap}.toolbar strong{font-size:17px;color:#21467f}.toolbar small{display:block;color:#64758a;font-size:13px;margin-top:4px}.controls{display:flex;gap:8px;align-items:center}select,a{font:inherit;background:#fff;color:#21467f;border:1px solid #dce5f0;border-radius:5px;padding:8px 10px;text-decoration:none}.stage{padding:24px 12px;display:flex;justify-content:center}.phone{width:390px;height:min(844px,calc(100vh - 150px));min-height:500px;border:1px solid #ccd8e8;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 8px 32px #21467f0b}iframe{border:0;width:100%;height:100%;background:#fff}@media(max-width:600px){.toolbar{padding:12px}.toolbar small{display:none}.stage{padding:0}.phone{width:100%!important;border:0;border-radius:0;height:calc(100dvh - 105px);min-height:400px}.controls select{max-width:150px}}
